# Preloaded mod package for Super Dodge Ball. Single-line values only: the
# manifest parser is line-based (key = value, [[section]]), with # comments.
#
# This package is NOT a gate any more, and says so rather than pretending.
#
# It used to be. Ticking it loaded cheats/Super Dodge Ball (USA).cht, and the
# in-game rows stayed greyed out until you did. That was one step too many, and
# the extra step carried no information: with a row on, the game behaves the
# same whether this switch is on or off. A row that looks like it should matter
# and does not is worse than no row. The cheat file is now loaded at power-on
# whatever this switch says, and each cheat is its own switch in the in-game
# Cheats menu (Escape -> Cheats).
#
# What it still does: tell the Mods screen that this game has cheats, so a
# player browsing there finds out. It arms nothing by itself.
#
# CHEATS CHANGE THE GUEST. An armed code writes the machine's RAM, or substitutes
# a byte the CPU reads out of PRG ROM, so the game then computes different things
# than it would in hardware, and a save state or recorded vector made with one
# armed does not compare against a stock one. The default-off property is
# unchanged and is now per-cheat: no row on means no write, which is a stronger
# statement than one feature switch.
#
# This package is DATA ONLY -- a declaration of a feature whose implementation
# is src/sdb_cheats.c, compiled into nes_game and registered by the stable id
# below. A .nesmod archive cannot carry native code (see the framework's
# docs/MOD_PACKAGES.md), so the licence here necessarily matches the licence of
# the code that does the work; it is not separately licensed.
format_version = 1
id = "super-dodgeball.cheats"
version = "1.0.0"
name = "Cheats"
author = "Super Dodge Ball Recomp"
description = "This game has cheats. Press Escape and open the Cheats menu to pick them; the codes come from cheats/Super Dodge Ball (USA).cht, in the same format the NES libretro cores use. RAM codes freeze a byte every frame; codes above $8000 and Game Genie codes substitute the value the CPU reads out of PRG ROM, which is how a code patches the game's own code without rewriting the image. Not hardware-accurate: an armed cheat changes guest state, so save states and recorded vectors made with one are not comparable with stock ones."
license = "PolyForm-Noncommercial-1.0.0"
resolver = "declarative"
save_compatibility = "shared"

# Lowercase CRC-32 of the cartridge payload after the iNES header.
[[target]]
game_id = "super-dodgeball"
rom_crc32 = "689971f9"

[[feature]]
id = "cheats"
name = "Cheats"
description = "Load cheats/Super Dodge Ball (USA).cht and arm the entries it has enabled. Changes guest state."
group = "Emulation"
default_enabled = false

# Like the other activation plugins: the callback needs no option, it just
# loads the file. A file with nothing enabled loads and arms nothing, which is
# what the libretro database ships and what "the player picks" means.
[[plugin]]
feature = "cheats"
id = "super-dodgeball.cheats"