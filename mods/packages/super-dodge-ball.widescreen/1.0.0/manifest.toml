# Preloaded mod package for Super Dodge Ball. Single-line values only: the
# manifest parser is line-based (key = value, [[section]]), with # comments.
#
# One feature, default-disabled:
#   widescreen  present 16:9 / 21:9 / 32:9 instead of the stock 256x240, with
#               the extra columns showing the court AND the players the NES
#               could not display. Not a toggle: a widescreen margin with no
#               sprites in it is not widescreen, it is the same frame with black
#               columns glued on. Use `stock` for background-only margins.
#
# Turning it on also reveals the 8 columns the PPU hides at the left. Those
# columns are drawn by the same compositor, so they are not separable: an
# overscan toggle left off while widescreen is on puts a black band at the margin
# boundary, which is precisely the artefact widescreen exists to remove. It was a
# separate feature and it was folded in for that reason -- same call already made
# for margin sprites, which are likewise part of "widescreen" rather than an
# option beside it.
#
# This package is DATA ONLY -- a declaration of features whose implementation is
# src/sdb_host_extras.c, compiled into nes_game and registered by the stable ids
# below. A .nesmod archive cannot carry native code (see the framework's
# docs/MOD_PACKAGES.md), so the licence here necessarily matches the licence of
# the code that does the work; it is not separately licensed.
format_version = 1
id = "super-dodge-ball.widescreen"
version = "1.0.0"
name = "Widescreen"
author = "Super Dodge Ball Recomp"
description = "Presents the game in 16:9, 21:9, 32:9 or the window's own shape, revealing the blank left-hand columns the game hides and the off-screen players the NES could not display. The guest is untouched: the extra columns are read out of the nametable, CHR and the frame's own scroll, and the stock 256-column picture stays authoritative in the middle, so the centre of a wide frame is pixel-for-pixel the unmodded game. Past the court's own 512-pixel world the margin is the backdrop colour, because there is nothing there to show. Not upscaled: the same chunky pixels, on a wider canvas."
license = "PolyForm-Noncommercial-1.0.0"
resolver = "declarative"
save_compatibility = "shared"

# Lowercase CRC-32 of the cartridge payload after the iNES header.
[[target]]
game_id = "super-dodge-ball"
rom_crc32 = "689971f9"

[[feature]]
id = "widescreen"
name = "Widescreen"
description = "Present 16:9, 21:9, 32:9 or fit. Extra columns show the court the NES could not display. Presentation only; no upscaling."
group = "Display"
default_enabled = false

# The aspect ratio of the presented canvas. The widths are the engine's own
# (common/nes_video_geometry.h): 426 / 560 / 854 columns for a 240-row
# picture. "fit" follows the window's shape instead.
[[option]]
feature = "widescreen"
id = "aspect"
label = "Aspect ratio"
type = "choice"
default = "fit"

[[option.choice]]
value = "stock"
label = "Stock (256x240)"

[[option.choice]]
value = "16:9"
label = "16:9 Widescreen"

[[option.choice]]
value = "21:9"
label = "21:9 Ultrawide"

[[option.choice]]
value = "32:9"
label = "32:9 Super Ultrawide"

[[option.choice]]
value = "fit"
label = "Fit the window"

# Where the camera looks. The court is 440 world columns ([40,480), the camera
# clamp at $E6AB) and the game's own viewport slides 184 columns of it, so at
# 21:9 and 32:9 every column of the court is already on screen at every camera
# position play reaches -- the panning adds motion, not information. Locked
# makes the canvas a fixed window on the court and the game pans behind it; the
# view only moves when the width cannot hold the court (16:9 loses 7 columns at
# each end). Presentation only: $C3/$C4, OAM and the machine's own 256 columns
# are untouched, the block is simply placed elsewhere on the canvas.
[[option]]
feature = "widescreen"
id = "camera"
label = "Camera"
type = "choice"
default = "follow"

[[option.choice]]
value = "follow"
label = "Follow the ball (stock)"

[[option.choice]]
value = "locked"
label = "Locked: show the whole court"

# An ACTIVATION plugin registered with nes_mod_register_activation_plugin().
# It reads the aspect and the camera policy above with nes_mod_option_value(),
# installs the compositor and asks the backend for that width; the reset
# callback puts the stock 256-column picture back. Enabling it also enables the
# clipped-column reveal and the margin-sprite capture sites -- see the header.
[[plugin]]
feature = "widescreen"
id = "super-dodge-ball.widescreen"