name: CI

# ROM-less validation: the full game build needs a user-supplied ROM
# (gitignored, never committed), so CI covers everything up to that point:
# engine checkout, patch application, recompiler build, script syntax,
# and config parsing.
on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Init nesrecomp submodule only
        run: git submodule update --init external/nesrecomp

      - name: Engine patches apply cleanly (none active today)
        # A patch that no longer applies is a silent failure: setup.sh reports
        # "skipped (already applied or conflicts)" and the build proceeds
        # without it. There are no active patches right now, so this is the
        # step that will catch the first one that does not fit.
        run: |
          set -e
          shopt -s nullglob
          patches=(patches/*.patch)
          [ ${#patches[@]} -eq 0 ] && { echo "no active patches"; exit 0; }
          for p in "${patches[@]}"; do
            git -C external/nesrecomp apply --check "$p" \
              || { echo "patch does not apply: $p" >&2; exit 1; }
            echo "applies: $p"
          done

      - name: Install build tools
        run: sudo apt-get update -q && sudo apt-get install -qy cmake ninja-build

      - name: Build recompiler (pure C11, no extra deps)
        run: |
          cmake -S external/nesrecomp/recompiler -B build-recompiler -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-recompiler

      - name: Shell syntax (setup + helpers)
        run: |
          bash -n setup.sh
          bash -n build_and_run.sh
          bash -n tools/frame_gen/run_frames.sh

      - name: Shell syntax (release scripts)
        # These build and package what the releases page publishes, and a
        # syntax error in them is only found on release day otherwise.
        run: |
          bash -n tools/release/build.sh
          bash -n tools/release/appimage/build_appimage.sh
          sh -n tools/release/appimage/AppRun.in || true   # a template, not a script
          sh -n tools/release/appimage/test_appimage_layout.sh
          sh -n tools/release/build.sh

      - name: The release scripts parse
        run: python3 -m compileall -q tools/release/

      - name: Python compiles
        run: python3 -m compileall -q tools/

      - name: game.toml parses
        run: python3 -c "import tomllib; tomllib.load(open('src/game.toml','rb')); print('game.toml OK')"
