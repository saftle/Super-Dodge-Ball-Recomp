# Sound-engine alternate entry (STA $0700 phase of the $8006 cluster),
# reached at match-transition; skipping it starves the tick
[[extra_func]]
addr = 0x801B
bank = 0

# Menu input checker (BIT/BVS/BMI + LDA $27/CMP #$10 Start test), reached
# from bank-1 $8809 at the lineup→match transition (frame ~182)
[[extra_func]]
addr = 0x897D
bank = 1

# Sibling branch target in the same menu input/checker cluster ($897D's BVS
# lands here; scroll/pos calc LDA $37/ADC #$10/AND #$E0)
[[extra_func]]
addr = 0x89A9
bank = 1

# Bank-6 state machine called from fixed $C0F3 at the match transition.
# Undiscovered it falls into the interpreter, whose terminal RTS pops two
# live-caller bytes (+2 S per call: $FF→$01 observed) and cascades into bank
# thrash ($8E00-data, $C000 BRK) and hang.
[[extra_func]]
addr = 0x8E00
bank = 6

[[replace_func]]
addr = 0xFCA0
scope = "member"

# Bank-6 shared tail ($8393: STX $1C, PLA, PLA, ...) reached by 18 bank-6
# JMP sites. The PLA PLA consumes 2 ancestor-pushed arg bytes, but tail
# calls push nothing natively, so with an empty stack they eat $0100/$0101
# (mode bytes $C0/$00 observed) and cascade into bank thrash ($C000 BRK)
# and hang. The popped values are discarded by the body (overwritten by
# LDA #$00), so stand in the missing depth with dummies: net-0 S,
# deterministic flags.
[[replace_func]]
addr = 0x8393
bank = 6
scope = "member"

# NOTE (2026-10-01): [[merge_range]] over F09F/F13A loops was tried for the
# C-stack lap growth (F1AA→F13A via call_by_address, +1 C-frame/lap) but
# reverted: merged entries double-emit across bank-7 codegen parts sharing
# one TU (_full.c) and break the build. Narrow ranges hit the same
# limitation. Revisit only with a recompiler-side dedup fix.

[force_interp]
fixed = []
bank0 = []
bank1 = []
bank2 = []
bank3 = []
bank4 = []
bank5 = []
bank6 = []
bank7 = []
